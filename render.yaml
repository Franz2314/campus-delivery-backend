services:
  - type: web
    name: campus-delivery-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && node src/db/migrate.js && node src/db/seed.js
    startCommand: node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: campus-delivery-db
          property: connectionString

databases:
  - name: campus-delivery-db
    plan: free
    region: oregon
    databaseName: campus_delivery
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
